<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Mulapin Research Group">
  <!-- Horizontal Mulapin treatment using the exact canonical mark and palette. -->
  <rect width="1200" height="630" fill="#14161A"/>
  <rect x="72" y="60" width="1056" height="2" fill="#C9A20E"/>
  <rect x="72" y="568" width="1056" height="2" fill="#C9A20E"/>

  <g transform="translate(120 190) scale(1.25)">
    <circle cx="100" cy="100" r="37" fill="#000000"/>
    <circle cx="100" cy="100" r="40" fill="none" stroke="#C9A20E" stroke-width="7"/>
    <g fill="none" stroke="#C9A20E">
      <circle cx="100" cy="100" r="46.5" stroke-width="1.2" opacity="0.5"/>
      <circle cx="100" cy="100" r="52" stroke-width="2.6" opacity="0.5"/>
      <circle cx="100" cy="100" r="67" stroke-width="1.9" opacity="0.28"/>
      <circle cx="100" cy="100" r="85" stroke-width="1.4" opacity="0.14"/>
    </g>
  </g>

  <text x="440" y="286" fill="#F6F3EB"
        font-family="Iowan Old Style, Charter, Palatino Linotype, Palatino, Hoefler Text, Georgia, serif"
        font-size="86" font-weight="700" letter-spacing="18">MULAPIN</text>
  <text x="446" y="350" fill="#C9A20E"
        font-family="Avenir Next, Optima, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="28" font-weight="600" letter-spacing="12">RESEARCH GROUP</text>
  <line x1="444" y1="392" x2="1056" y2="392" stroke="#8E7108" stroke-width="2"/>
  <text x="446" y="442" fill="#737983"
        font-family="Avenir Next, Optima, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="22" letter-spacing="4.5">SPACE · TECHNOLOGY · GOVERNANCE</text>
</svg>
